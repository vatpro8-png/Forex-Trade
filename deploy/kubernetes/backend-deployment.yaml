apiVersion: v1
kind: Namespace
metadata:
  name: sfc-capital-fx

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sfc-backend-config
  namespace: sfc-capital-fx
data:
  config.json: |
    {
      "environment": "production",
      "api": {
        "host": "0.0.0.0",
        "port": 8443,
        "log_level": "info"
      },
      "webhook": {
        "timeout_seconds": 30,
        "max_payload_size_mb": 1
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: sfc-secrets
  namespace: sfc-capital-fx
type: Opaque
stringData:
  db_host: "postgres.sfc-capital-fx.svc.cluster.local"
  db_port: "5432"
  db_name: "sfc_capital_fx"
  db_user: "sfc_user"
  db_password: "CHANGE_IN_PRODUCTION"
  telegram_bot_token: "CHANGE_IN_PRODUCTION"
  telegram_chat_id: "CHANGE_IN_PRODUCTION"
  jwt_secret: "CHANGE_IN_PRODUCTION"
  tradingview_webhook_secret: "CHANGE_IN_PRODUCTION"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfc-backend
  namespace: sfc-capital-fx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sfc-backend
  template:
    metadata:
      labels:
        app: sfc-backend
    spec:
      containers:
      - name: api
        image: sfcapitalfx/backend:latest
        ports:
        - containerPort: 8443
          name: https
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: db_host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: db_port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: db_name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: db_password
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: telegram_bot_token
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: telegram_chat_id
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: jwt_secret
        - name: TRADINGVIEW_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: sfc-secrets
              key: tradingview_webhook_secret
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: sfc-backend
  namespace: sfc-capital-fx
spec:
  type: LoadBalancer
  selector:
    app: sfc-backend
  ports:
  - port: 443
    targetPort: 8443
    protocol: TCP
    name: https

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sfc-backend-hpa
  namespace: sfc-capital-fx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sfc-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
